name: Checks

on:
  push:
  pull_request:

jobs:
  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: .\desktop\build.ps1
      - name: Run self-test
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath .\desktop\dist\PrettyCopyDesktop.exe `
            -ArgumentList '--self-test' `
            -WindowStyle Hidden `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Desktop self-test failed with exit code $($process.ExitCode)."
          }
